name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every JS file
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
          echo "All JS files parse OK"
      - name: Run unit tests
        run: npm test
